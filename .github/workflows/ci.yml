name: LogLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev libgtest-dev sqlite3

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite googletest

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install sqlite3:x64-windows gtest:x64-windows

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run Test Suites
        run: |
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Run Application Ingestion Demo
        run: |
          ./build/loglens analyze data/sample.log --db ci_test.db
          ./build/loglens report --db ci_test.db
        if: runner.os != 'Windows'

      - name: Run Application Ingestion Demo (Windows)
        run: |
          .\build\${{ matrix.build_type }}\loglens.exe analyze data\sample.log --db ci_test.db
          .\build\${{ matrix.build_type }}\loglens.exe report --db ci_test.db
        if: runner.os == 'Windows'
