# LogLens Root Cause Analysis Rules
# Format: RULE_ID | PRIORITY (higher evaluated first) | KEYWORD | DIAGNOSIS_DESCRIPTION
RCA-MEM-01 | 100 | out of memory | Memory pressure: Host exhausted RAM or allocation limit reached
RCA-MEM-02 | 95  | allocation failure | Memory pressure: Dynamic memory allocation failure
RCA-SYS-01 | 90  | segmentation fault | Memory corruption or illegal pointer dereference
RCA-SYS-02 | 85  | access violation | Unhandled memory fault or null dereference
RCA-STO-01 | 80  | disk full | Storage exhaustion: File system has no remaining space
RCA-STO-02 | 75  | no space left on device | Storage capacity issue: Volume limit reached
RCA-NET-01 | 70  | connection timeout | Network latency or downstream host unreachable
RCA-NET-02 | 68  | connection refused | Service port closed or process not listening
RCA-NET-03 | 65  | network unreachable | Network route partition or network interface down
RCA-SEC-01 | 60  | authentication failed | Security failure: Invalid credentials or expired token
RCA-SEC-02 | 55  | unauthorized | Access control: Insufficient permission or invalid signature
RCA-SVC-01 | 50  | service unavailable | Dependency outage: Upstream service returned 503
RCA-SVC-02 | 45  | bad gateway | Gateway failure: Upstream reverse proxy returned 502
RCA-SVC-03 | 40  | gateway timeout | Gateway failure: Upstream response timed out
